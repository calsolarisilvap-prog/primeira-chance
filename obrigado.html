<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento confirmado | Primeira Chance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #102a4c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 24px;
      padding: 38px 26px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .check {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 14px;
    }

    p {
      color: #5e6e82;
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .whatsapp {
      display: block;
      background: #20d466;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      padding: 18px 20px;
      border-radius: 50px;
      box-shadow: 0 8px 22px rgba(32,212,102,.25);
    }

    .info {
      margin-top: 18px;
      font-size: 14px;
      color: #7b8797;
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      src="assets/logo/logo.png"
      alt="Primeira Chance"
      class="logo"
    >

    <div class="check">✅</div>

    <h1>Pagamento realizado!</h1>

    <p>
      Obrigado por adquirir o <strong>Kit Primeira Chance</strong>.
      Agora falta apenas um passo para começarmos seu atendimento.
    </p>

    <a
      class="whatsapp"
      href="https://wa.me/5548999616736?text=Ol%C3%A1%21%20Acabei%20de%20comprar%20o%20Kit%20Primeira%20Chance%20pelo%20site%20e%20quero%20iniciar%20meu%20atendimento."
    >
      📲 ENVIAR MEU CURRÍCULO
    </a>

    <div class="info">
      Você será direcionado para o atendimento pelo WhatsApp.
    </div>

  </main>

</body>
</html>
